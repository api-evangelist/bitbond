- name: Bitbond Token Tool API
  description: >-
    Programmatic token and smart-contract deployment API for Token Tool. Enables
    minting, burning, transferring, pausing, and metadata updates on
    CertiK-audited ERC-20/ERC-1400/ERC-721 contracts, plus token sales, airdrops,
    vesting, and payment automation across EVM and non-EVM chains. Interaction is
    contract/SDK-level, with published TypeScript example scripts and an official
    MCP server.
  humanURL: https://docs.bitbond.com/asset-tokenization-suite/token-tool/token-tool-api
