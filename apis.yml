aid: bitbond
name: Bitbond
description: >-
  Bitbond is a Berlin-based tokenization technology company (Bitbond GmbH) that
  provides an Asset Tokenization Suite for issuing, managing, and distributing
  digital assets on public blockchains. Its two developer-facing products are
  Token Tool, a self-serve platform and API for deploying and managing compliant
  ERC-20, ERC-1400, and ERC-721 smart contracts (minting, burning, transfers,
  vesting, token sales, airdrops, and payment automation) across 11+ EVM and
  non-EVM chains; and Offering Manager, an end-to-end securities-issuance
  platform with a public investor REST API covering offerings, orders, payments,
  KYC/AML, and investor profiles. Bitbond also ships an official Token Tool MCP
  server so AI agents can deploy and manage tokens, plus documented webhooks,
  testnet faucets, and a status page.
