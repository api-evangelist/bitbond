apis:
- name: Bitbond Offering Manager API
  description: >-
    Public investor REST API for the Bitbond Offering Manager securities-issuance
    platform. Covers offerings lookup, orders, checkout/payments, KYC, investor
    profiles, and GDPR data export/erase. Protected endpoints authenticate with a
    Privy bearer token; a separate issuer-management API authenticates with an
    issuer API key or session JWT.
  humanURL: https://docs.bitbond.com/asset-tokenization-suite/offering-manager/intro-offering-manager
  baseURL: https://om.bitbond.com/api/public
